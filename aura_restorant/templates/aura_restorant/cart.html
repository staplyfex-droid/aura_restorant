<h1>Кошик</h1>

{% if cart|length %}
<table>
    <tr><th>Страва</th><th>Ціна</th><th>Кількість</th><th>Сума</th><th></th></tr>
    {% for item in cart %}
    <tr>
        <td><a href="{% url 'dish_detail' item.dish.pk %}">{{ item.dish.name }}</a></td>
        <td>{{ item.price }} грн</td>
        <td>
            <form method="post" action="{% url 'cart_add' item.dish.pk %}">
                {% csrf_token %}
                <input type="number" name="quantity" value="{{ item.quantity }}" min="1" max="20">
                <input type="hidden" name="override" value="on">
                <button type="submit">Оновити</button>
            </form>
        </td>
        <td>{{ item.subtotal }} грн</td>
        <td>
            <form method="post" action="{% url 'cart_remove' item.dish.pk %}">
                {% csrf_token %}
                <button type="submit">Видалити</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<p><strong>Разом: {{ cart.total_price }} грн</strong></p>
<a href="{% url 'checkout' %}">Оформити замовлення</a>
{% else %}
    <p>Кошик порожній.</p>
    <a href="{% url 'home' %}">До меню</a>
{% endif %}
