<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій Сайт{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f6f8; color: #333; line-height: 1.6; }
        
        header { background: #1e293b; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-weight: 600; }
        nav a { margin-left: 1rem; color: #cbd5e1; transition: color 0.2s; }
        nav a:hover { color: #fff; }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        /* Form Card */
        .auth-card { max-width: 420px; margin: 3rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .auth-card h2 { margin-bottom: 1.5rem; font-size: 1.5rem; text-align: center; color: #0f172a; }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        
        .btn { display: inline-block; width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .btn-logout { background: transparent; border: none; color: #cbd5e1; font-size: 1rem; cursor: pointer; margin-left: 1rem; }
        .btn-logout:hover { color: #fff; }

        .auth-links { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #64748b; }
        .auth-links a { color: #2563eb; text-decoration: none; }

        /* Errors & Messages */
        .errorlist { color: #dc2626; list-style: none; font-size: 0.85rem; margin-top: 0.25rem; }
        .alert { padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; font-size: 0.9rem; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <header>
        <a href="{% url 'home' %}">Головна</a>
        <nav>
            {% if user.is_authenticated %}
                <span>Вітаємо, <strong>{{ user.username }}</strong>!</span>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Вийти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a>
                <a href="{% url 'register' %}">Реєстрація</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

</body>
</html>
